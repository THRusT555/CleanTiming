<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title">
<title id="title">入力配信と画像取得は並行して進む</title>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8" fill="#4f6982"/>
</marker>
</defs>
<rect width="960" height="370" rx="12" fill="#f4f7fb"/>
<g font-family="Yu Gothic UI, sans-serif" font-size="20" fill="#17324d">
<text x="24" y="35" >入力配信と画像取得：左から右へ進む、別々の経路</text>
<rect x="20" y="145" width="164" height="78" rx="8" fill="#fff" stroke="#9eb3c9"/>
<text x="32" y="174" >Windows入力</text>
<text x="32" y="202" font-size="18">キーボード等</text>
<path d="M184 170L235 100" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M184 195L235 280" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="240" y="62" width="230" height="76" rx="8" fill="#fff" stroke="#9eb3c9"/>
<text x="252" y="91" >対象アプリ</text>
<text x="252" y="119" font-size="18">入力処理 → 描画</text>
<path d="M470 100L510 100" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="515" y="62" width="185" height="76" rx="8" fill="#fff" stroke="#9eb3c9"/>
<text x="527" y="91" >OS画像更新</text>
<text x="527" y="119" font-size="18">画像時刻を採る</text>
<text x="249" y="179" font-size="18">両者の受信順は固定しない</text>
<rect x="240" y="240" width="230" height="76" rx="8" fill="#fff" stroke="#9eb3c9"/>
<text x="252" y="269" >本ツールの入力受信</text>
<text x="252" y="297" font-size="18">WM_INPUT入口＝0ms</text>
<path d="M700 100L740 100" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="745" y="62" width="190" height="76" rx="8" fill="#fff" stroke="#9eb3c9"/>
<text x="757" y="91" >画像取得 → 保存</text>
<text x="757" y="119" font-size="18">更新QPCを保持</text>
<path d="M840 138L840 278" fill="none" stroke="#4f6982" stroke-width="2.5" />
<path d="M470 278L740 278" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="745" y="240" width="190" height="76" rx="8" fill="#fff" stroke="#9eb3c9"/>
<text x="757" y="269" >入力と画像を対応</text>
<text x="757" y="297" font-size="18">同じQPCの差</text>
<text x="24" y="351" >画像の時刻は取得・保存完了時刻へ置き換えない。</text>
</g>
</svg>
