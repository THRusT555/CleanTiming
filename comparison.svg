<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title">
<title id="title">同じ0msと目印に揃え、画像間隔と欠測も比べる</title>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8" fill="#4f6982"/>
</marker>
</defs>
<rect width="960" height="360" rx="12" fill="#f4f7fb"/>
<g font-family="Yu Gothic UI, sans-serif" font-size="20" fill="#17324d">
<text x="24" y="35" >A/B比較：入力＝0ms、目印＝弾数が減った最初の画像</text>
<text x="24" y="126" >条件A</text>
<path d="M150 120L915 120" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="24" y="241" >条件B</text>
<path d="M150 235L915 235" fill="none" stroke="#4f6982" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="175" y="316" font-size="18">0</text>
<text x="283" y="316" font-size="18">4</text>
<text x="391" y="316" font-size="18">8</text>
<text x="499" y="316" font-size="18">12</text>
<text x="607" y="316" font-size="18">16</text>
<text x="715" y="316" font-size="18">20</text>
<text x="823" y="316" font-size="18">24</text>
<text x="878" y="316" >ms</text>
<path d="M190 67L190 276" fill="none" stroke="#526878" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="157" y="62" >0ms</text>
<circle cx="298" cy="120" r="7" fill="#fff" stroke="#2366ad" stroke-width="2"/>
<circle cx="406" cy="120" r="7" fill="#fff" stroke="#2366ad" stroke-width="2"/>
<circle cx="514" cy="120" r="7" fill="#2366ad" stroke="#2366ad" stroke-width="2"/>
<circle cx="622" cy="120" r="7" fill="#2366ad" stroke="#2366ad" stroke-width="2"/>
<circle cx="730" cy="120" r="7" fill="#2366ad" stroke="#2366ad" stroke-width="2"/>
<circle cx="352" cy="235" r="7" fill="#fff" stroke="#2366ad" stroke-width="2"/>
<circle cx="514" cy="235" r="7" fill="#fff" stroke="#2366ad" stroke-width="2"/>
<circle cx="730" cy="235" r="7" fill="#2366ad" stroke="#2366ad" stroke-width="2"/>
<circle cx="838" cy="235" r="7" fill="#2366ad" stroke="#2366ad" stroke-width="2"/>
<path d="M406 92L514 92" fill="none" stroke="#2366ad" stroke-width="8"/>
<text x="390" y="81" >8～12ms：初確認</text>
<path d="M514 208L730 208" fill="none" stroke="#2366ad" stroke-width="8"/>
<text x="555" y="194" >12～20ms：初確認</text>
<rect x="568" y="222" width="108" height="26" fill="#fff0db" stroke="#aa5b17" stroke-dasharray="5 4"/>
<text x="532" y="279" fill="#aa5b17" font-size="18">欠測あり：確定前に確認</text>
<text x="24" y="345" font-size="18">白：変化なし　青：変化あり　間隔や欠測が違えば、区間の幅も変わる。</text>
</g>
</svg>
